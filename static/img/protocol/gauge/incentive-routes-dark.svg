<svg width="880" height="470" viewBox="0 0 880 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four routes from an issuer to LPs: direct gauge rewards and Merkl pay your token; owned votes and vote incentives raise the gauge weight, which pays CRV.">
<rect width="880" height="470" fill="#12110F"/>
<rect width="880" height="44" fill="#242322"/>
<text x="20" y="28" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0EDEA" text-anchor="start" letter-spacing="0.3">HOW EACH ROUTE REACHES LPS</text>
<rect x="20" y="80" width="140" height="322" fill="#2A2927"/>
<text x="90.0" y="230.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0EDEA" text-anchor="middle">Issuer</text>
<text x="90.0" y="249.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B3B0AC" text-anchor="middle">budget or</text>
<text x="90.0" y="265.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B3B0AC" text-anchor="middle">locked capital</text>
<rect x="210" y="80" width="210" height="64" fill="#2A2927"/>
<text x="315.0" y="109.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0EDEA" text-anchor="middle">Direct gauge rewards</text>
<text x="315.0" y="128.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B3B0AC" text-anchor="middle">your token, streamed weekly</text>
<rect x="210" y="166" width="210" height="64" fill="#2A2927"/>
<text x="315.0" y="195.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0EDEA" text-anchor="middle">Holding veCRV or vlCVX</text>
<text x="315.0" y="214.0" font-family="'Mona Sans', 'Hubot Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B3B0AC" text-anchor="middle">you vote for your gauge</text>
