name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Swagger UI has React 18-only transitive peers; this site uses React 19.
      - run: npm ci --legacy-peer-deps
      - run: npm run test:ai-docs
      - run: npm run build
